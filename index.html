<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>トレードダッシュボード</title>

<style>
body {
  font-family: sans-serif;
  background: #0f172a;
  color: white;
  text-align: center;
}
.card {
  background: #1e293b;
  margin: 10px;
  padding: 20px;
  border-radius: 12px;
}
</style>
</head>

<body>

<h1>トレードダッシュボード</h1>

<div class="card">USDJPY: <span id="usdjpy">--</span></div>
<div class="card">ゴールド: <span id="gold">--</span></div>
<div class="card">BTCUSD: <span id="btc">--</span></div>
<div class="card">米10年利回り: <span id="yield">--</span></div>
<div class="card">実質金利: <span id="real">--</span></div>
<div class="card">判断: <span id="comment">--</span></div>

<script>
const API_KEY = "0b6059c8fad24f9393f34be313f78314";

// 🔥 ここが重要（値を保持する）
let usdjpy = "--";
let gold = 2300;
let btc = 60000;

async function getData() {

  // ===== USDJPYだけリアル取得（安定）=====
  try {
    let res = await fetch(`https://api.twelvedata.com/price?symbol=USD/JPY&apikey=${API_KEY}`);
    let data = await res.json();

    if (data.price && !isNaN(data.price)) {
      usdjpy = parseFloat(data.price);
    }

  } catch (e) {
    console.log("FX error", e);
  }

  // ===== ゴールド（ダミーで安定）=====
  gold = gold + (Math.random() - 0.5) * 2;

  // ===== BTC（ダミーで安定）=====
  btc = btc + (Math.random() - 0.5) * 200;

  // ===== 米10年 =====
  let yield10 = 4.3 + (Math.random() - 0.5) * 0.03;

  // ===== 実質金利 =====
  let inflation = 2.0;
  let real = yield10 - inflation;

  // ===== 表示 =====
  document.getElementById("usdjpy").innerText =
    usdjpy === "--" ? "--" : usdjpy.toFixed(3);

  document.getElementById("gold").innerText =
    gold.toFixed(2);

  document.getElementById("btc").innerText =
    btc.toFixed(0);

  document.getElementById("yield").innerText =
    yield10.toFixed(2) + "%";

  document.getElementById("real").innerText =
    real.toFixed(2) + "%";

  // ===== 判断 =====
  let comment = "";

  if (real > 2 && usdjpy > 150) {
    comment = "ドル最強・ゴールド売り圧力";
  } else if (real < 1) {
    comment = "ゴールド買い優位";
  } else {
    comment = "様子見";
  }

  document.getElementById("comment").innerText = comment;
}

getData();
setInterval(getData, 60000);
</script>

</body>
</html>
