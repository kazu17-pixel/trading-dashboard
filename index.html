<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>トレードダッシュボード</title>

<style>
body {
  font-family: sans-serif;
  background: #0f172a;
  color: white;
  text-align: center;
}

.card {
  background: #1e293b;
  margin: 10px;
  padding: 20px;
  border-radius: 12px;
}

.up { color: #22c55e; }
.down { color: #ef4444; }
</style>
</head>

<body>

<h1>トレードダッシュボード</h1>

<div class="card">
  米10年利回り: <span id="yield">--</span>
</div>

<div class="card">
  USDJPY: <span id="usdjpy">--</span>
</div>

<div class="card">
  ゴールド: <span id="gold">--</span>
</div>

<div class="card">
  実質金利: <span id="real">--</span>
</div>

<div class="card">
  判断: <span id="comment">--</span>
</div>

<script>
async function getData() {

  // 仮データ（後でAPIに変える）
  let yield10 = 4.3 + (Math.random() - 0.5) * 0.1;
  let usdjpy = 155 + (Math.random() - 0.5) * 1;
  let gold = 2300 + (Math.random() - 0.5) * 10;

  let inflation = 2.0; // 固定
  let real = yield10 - inflation;

  document.getElementById("yield").innerText = yield10.toFixed(2) + "%";
  document.getElementById("usdjpy").innerText = usdjpy.toFixed(2);
  document.getElementById("gold").innerText = gold.toFixed(0);
  document.getElementById("real").innerText = real.toFixed(2) + "%";

  // 判断ロジック
  let comment = "";

  if (real > 2 && usdjpy > 150) {
    comment = "ドル最強・ゴールド売り圧力";
  } else if (real < 1) {
    comment = "ゴールド買い優位";
  } else {
    comment = "様子見";
  }

  document.getElementById("comment").innerText = comment;
}

getData();
setInterval(getData, 5000);
</script>

</body>
</html>
